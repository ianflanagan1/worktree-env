[project]
name = "worktree-env"
version = "0.1.0"
description = "Gives each git worktree of a project its own HTTPS hostname and environment, from a fixed pool of slots, and creates and removes them."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-settings", "git-default-branch"]

[project.scripts]
worktree-env = "worktree_env.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }
repo-settings = { git = "https://github.com/ianflanagan1/repo-settings", tag = "v0.1.0" }
git-default-branch = { git = "https://github.com/ianflanagan1/git-default-branch", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
